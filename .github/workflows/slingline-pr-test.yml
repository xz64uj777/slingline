name: Slingline PR test build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "vite.config.ts"
      - ".github/workflows/slingline-pr-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slingline-pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: slingline-pr-build
          path: .vercel/output/**
          if-no-files-found: error
          retention-days: 7
