name: Build and publish Slingline to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slingline-pages-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Lint
        working-directory: source
        run: npm run lint

      - name: Unit tests
        working-directory: source
        run: npm test

      - name: Build client and server bundles
        working-directory: source
        env:
          GITHUB_PAGES: "true"
        run: npx vite build

      - name: Publish fresh client assets into Pages site
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch gh-pages https://github.com/xz64uj777/slingline.git ../site
          test -d .vercel/output/static/assets
          npx vite preview --host 127.0.0.1 --port 8081 > /tmp/slingline-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          RENDERED=false
          for attempt in $(seq 1 30); do
            for route in /slingline/ /; do
              if curl -fsS "http://127.0.0.1:8081$route" -o ../site/index.html; then
                if grep -q "TOUCH SENSITIVITY" ../site/index.html; then
                  RENDERED=true
                  break
                fi
              fi
            done
            if [ "$RENDERED" = true ]; then break; fi
            sleep 2
          done
          if [ "$RENDERED" != true ]; then
            echo "Fresh SSR HTML did not contain the updated touch controls"
            cat /tmp/slingline-preview.log
            exit 1
          fi
          echo "Rendered fresh SSR HTML with touch sensitivity controls"
          cp -a .vercel/output/static/. ../site/
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync } from 'node:fs';
          const htmlPath = '../site/index.html';
          let html = readFileSync(htmlPath, 'utf8');
          const assets = readdirSync('.vercel/output/static/assets');
          const index = assets.find((name) => /^index-.*\.js$/.test(name));
          const routes = assets.find((name) => /^routes-.*\.js$/.test(name));
          if (!index || !routes) throw new Error('Fresh client entry bundles were not found');
          html = html.replace(/\/slingline\/assets\/index-[A-Za-z0-9_-]+\.js/g, '/slingline/assets/' + index);
          html = html.replace(/\/slingline\/assets\/routes-[A-Za-z0-9_-]+\.js/g, '/slingline/assets/' + routes);
          if (!html.includes('/slingline/assets/' + index) || !html.includes('/slingline/assets/' + routes)) {
            throw new Error('Could not update both client bundle references in the existing Pages HTML');
          }
          writeFileSync(htmlPath, html);
          console.log('Published client bundles:', index, routes);
          NODE
          # Publish an index-based fallback for direct GitHub Pages refreshes.
          cp ../site/index.html ../site/404.html
          cd ../site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Pages changes to publish"
            exit 0
          fi
          git commit -m "Deploy latest Slingline client build"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/xz64uj777/slingline.git"
          git push origin gh-pages
