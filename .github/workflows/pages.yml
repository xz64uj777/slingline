name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build GitHub Pages static output
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify static output exists
        run: test -f .vercel/output/static/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
